name: Create Portable Release

on:
  push:
    branches:
      - main

jobs:
  build-portable:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to create releases and upload assets
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Create Project Directory Structure
        run: |
          # 1. Create Tool Folders (under MQData/Tools)
          mkdir -p MQData/Tools/Git
          mkdir -p MQData/Tools/dotnet
          mkdir -p MQData/Tools/NanaZip
          
          # 2. Create Game Data Folders (nested under MQData/Build)
          mkdir -p MQData/Build/Archives/Client
          mkdir -p MQData/Build/Archives/Caches
          mkdir -p MQData/Build/Archives/ClientOverride

      - name: Install Dependencies (7-Zip & Unzip)
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full unzip

      - name: Download and Extract Latest Portable Git (Windows)
        run: |
          # 1. Get the latest URL using GitHub API and jq/grep
          API_URL="https://api.github.com/repos/git-for-windows/git/releases/latest"
          DOWNLOAD_URL=$(curl -s $API_URL | grep "browser_download_url" | grep "PortableGit-.*-64-bit.7z.exe" | head -n 1 | cut -d '"' -f 4)
          
          echo "Downloading Git from: $DOWNLOAD_URL"
          curl -L "$DOWNLOAD_URL" -o "git-setup.exe"
          
          # 2. Extract Windows PortableGit using Linux 7z (since .7z.exe is an SFX archive)
          FINAL_PATH="MQData/Tools/Git"
          7z x "git-setup.exe" -o"$FINAL_PATH" -y
          
          # 3. Cleanup setup file
          rm -f "git-setup.exe"

      - name: Download .NET SDK for Windows
        run: |
          # Download the official installation script for Bash
          curl -L "https://dot.net/v1/dotnet-install.sh" -o "dotnet-install.sh"
          chmod +x dotnet-install.sh
          
          # Install the Windows x64 version of .NET into your portable structure
          ./dotnet-install.sh --channel 10.0 --install-dir "MQData/Tools/dotnet" --os win --architecture x64
          
          # Verify installation
          if [ -f "MQData/Tools/dotnet/dotnet.exe" ]; then
              echo ".NET SDK for Windows installed successfully."
          else
              echo "Error: dotnet.exe not found!"
              exit 1
          fi
          
          rm -f dotnet-install.sh

      - name: Download NanaZip Binaries (Windows)
        run: |
          # 1. Query GitHub API for NanaZip release assets
          API_URL="https://api.github.com/repos/M2Team/NanaZip/releases/latest"
          DOWNLOAD_URL=$(curl -s $API_URL | grep "browser_download_url" | grep "_Binaries.zip" | head -n 1 | cut -d '"' -f 4)
          
          if [ -z "$DOWNLOAD_URL" ]; then
              echo "Error: Could not find NanaZip binaries URL."
              exit 1
          fi
          
          echo "Downloading NanaZip from: $DOWNLOAD_URL"
          curl -L "$DOWNLOAD_URL" -o "nanazip_binaries.zip"
          
          # 2. Extract using unzip
          unzip -o "nanazip_binaries.zip" -d "MQData/Tools/NanaZip"
          rm -f "nanazip_binaries.zip"
          echo "NanaZip Binaries successfully deployed."

      - name: Bundle Release with 7-Zip
        run: |
          # Create the final Windows release zip archive using Linux 7z
          # Note: Linux file paths are case-sensitive. Ensure script filenames match exactly.
          7z a -tzip "MQRLauncher.zip" "launcher-entrypoint.ps1" "Play MQReawakened.bat" "MQData/" "-xr!.git*" "-xr!*.zip" "-xr!mtab" -r
          
          if [ -f "MQRLauncher.zip" ]; then
              echo "Archive created successfully."
          else
              echo "Error: Archive file not found."
              exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: "Latest Build"
          body: "Automated portable build from main branch. Commit: ${{ github.sha }}"
          files: MQRLauncher.zip
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}